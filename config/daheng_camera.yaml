# 大恒 Galaxy 相机驱动参数
# 用法: ros2 launch armor_track_ros2 daheng_camera.launch.py
# 或:   ros2 run armor_track_ros2 daheng_camera_node --ros-args -r __ns:=/camera \
#         -- <config 绝对路径>

serial_number: ""            # 相机序列号；留空则自动用第一台（先跑一次，日志会列出所有序列号）
exposure_us: 1000.0          # 固定曝光(us)。诊断结论：8000 灯条 bloom 洗白数字、3000 又太暗——数字不可见属光照问题
gain_db: 12.0                # 固定增益(dB)，范围 0~32
frame_id: "camera_optical_frame"
camera_name: "daheng"        # camera_info 里的相机名，标定 yaml 里的 camera_name 需与此一致
camera_info_url: "file:///home/sunny/camera_calib/calibration.yaml"   # 占位估算内参；正式标定后覆盖该 yaml
grab_timeout_ms: 1000        # GXDQBuf 取帧超时(ms)，连续失败会自动重连
