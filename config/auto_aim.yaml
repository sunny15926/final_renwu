# ============================================================
# armor_track_ros2 总配置（传统装甲识别 + 闭环自瞄 + 串口）
# ============================================================

#####----- 传统装甲识别（traditional_detector）-----#####
# 敌方颜色：red 或 blue（仅分割该颜色）。
# red = 分割红色装甲（蓝方视角）；blue = 分割蓝色装甲（红方视角）。
enemy_color: "red"

# HSV 颜色阈值。红色跨越色相环 0°/180° 两端，用两段区间取并集
red_hue_low: [0, 160]
red_hue_high: [20, 180]
blue_hue_low: 100
blue_hue_high: 124
saturation_low: 100
saturation_high: 255
value_low: 80
value_high: 255

# 形态学闭运算核大小
morph_kernel_size: 3

# 灯条筛选
max_angle_error: 45      # degree，灯条偏离竖直方向的最大角度
min_lightbar_ratio: 1.5  # 灯条最小长宽比
max_lightbar_ratio: 20   # 灯条最大长宽比
min_lightbar_length: 8   # 灯条最小长度（像素）

# 装甲配对判断
min_armor_ratio: 1       # 装甲板最小宽高比
max_armor_ratio: 5       # 装甲板最大宽高比
max_side_ratio: 1.5      # 左右灯条最大长度比
max_rectangular_error: 25  # degree，灯条与连线垂直误差

# 是否显示 HSV 二值图（无显示环境务必 false，否则 cv::imshow 报错）
debug: false

# ---- 传统检测器数字识别（ONNX Runtime，7 类：数字 0~5 + 哨兵） ----
# 填 digit_model_path 即可启用数字识别（结果打印 + 画图可视化）；
# enable_digit_filter=true 才按数字过滤候选（不识别出有效数字的装甲被剔除）。
enable_digit_filter: false
digit_model_path: "/home/sunny/Downloads/armor_track_ros2/Digital-recognition-master/model/model.onnx"
digit_model_input_size: 28
digit_class_num: 6
digit_match_threshold: 0.6    # softmax 最大概率低于该值的候选被剔除
digit_extend_ratio: 0.5       # 数字裁剪沿灯条轴线向两头各延伸的比例（单位=灯条长度，各延伸 1/2 个灯条长度）
perspective_debug: true       # 透视矫正 + 数字识别可视化窗口（需图形显示环境 DISPLAY）
digit_viz_stable: true        # 稳定可视化：固定画布 + 主目标锁定 + 上一帧保持（关掉回旧行为）
digit_collect_dir: ""         # 数字样本采集目录（如 /home/sunny/digit_dataset）；非空时可视化窗口按键 0~5/s 保存样本

# ---- 北科大 Reborn 数字分类器（独立插拔式，ONNX Runtime，9 类：1~5 + outpost/guard/base/negative） ----
# 用装甲板【四个角点】做透视矫正后分类，输出装甲编号 0~5（0=非编号目标，1~5=数字）。
# 结果只作为附加信息打印/记录，不影响闭环云台跟随与串口下发。
# 填 num_classifier_model_path 即可启用；留空则完全不加载该分类器。
num_classifier_model_path: "/home/sunny/Downloads/armor_track_ros2/assets/number_classifier.onnx"

#####----- 装甲板物理尺寸（⚠️ 必须与实际板一致，否则 PnP 测距不准） -----#####
small_armor_width: 0.135   # 小装甲板宽（m）
big_armor_width:   0.230   # 大装甲板宽（m）
lightbar_length:   0.056   # 灯条长（m，即装甲板高度方向）

#####----- 闭环自瞄（closed_loop_solver） -----#####
# Eye-in-Hand：用云台 IMU 回传的 yaw/pitch 构造旋转矩阵做闭环，不做手眼标定。
closed_loop_alpha: 0.3            # 一阶低通滤波系数 (0,1]，越小越平滑
closed_loop_angle_limit: 0.3      # 输出角度限幅（rad）
closed_loop_imu_timeout_ms: 100   # IMU 超时判定失效（ms），超时角度置 0 停止跟随
closed_loop_debug: true           # 打印 tvec/云台姿态/世界坐标/滤波前后角度

#####----- 节点默认参数（可被 launch 覆盖） -----#####
publish_rate: 30.0         # 下发频率（Hz），0 表示按相机帧率

#####----- 串口（serial_node） -----#####
serial_port: "/dev/ttyACM0"   # 串口设备节点
serial_baud: 460800           # 波特率（8N1）
# 说明：发送帧 yaw/pitch 为弧度，符号不取负（直接发期望角）。
# 若电控侧方向相反，改 src/serial_node.cpp 里 makeSendPacket 的正负号即可。
