# ============================================================
# armor_track_ros2 总配置（传统装甲识别 + 闭环自瞄 + 串口）
# ============================================================

#####----- 传统装甲识别（traditional_detector）-----#####
# 敌方颜色：red 或 blue（仅分割该颜色）。
# red = 分割红色装甲（蓝方视角）；blue = 分割蓝色装甲（红方视角）。
enemy_color: "red"

# HSV 颜色阈值。红色跨越色相环 0°/180° 两端，用两段区间取并集
red_hue_low: [0, 160]
red_hue_high: [20, 180]
blue_hue_low: 100
blue_hue_high: 124
saturation_low: 100
saturation_high: 255
value_low: 80
value_high: 255

# 形态学闭运算核大小
morph_kernel_size: 3

# 灯条筛选
max_angle_error: 45      # degree，灯条偏离竖直方向的最大角度
min_lightbar_ratio: 1.5  # 灯条最小长宽比
max_lightbar_ratio: 20   # 灯条最大长宽比
min_lightbar_length: 8   # 灯条最小长度（像素）

# 装甲配对判断
min_armor_ratio: 1       # 装甲板最小宽高比
max_armor_ratio: 5       # 装甲板最大宽高比
max_side_ratio: 1.5      # 左右灯条最大长度比
max_rectangular_error: 25  # degree，灯条与连线垂直误差

# 是否显示调试窗口（HSV 二值图 + 装甲框/EKF 叠加可视化；无显示环境务必 false，否则 cv::imshow 报错）
debug: true

#####----- PnP 物理尺寸（⚠️ 是灯条围成矩形的尺寸，非装甲外壳尺寸） -----#####
# 四个世界角点对应四根灯条的四个顶点（左上/右上/右下/左下）。
# 宽 = 左右灯条矩形宽，高 = 灯条长（矩形高方向）。当前固定步兵小装甲灯条：宽 0.140 / 高 0.055。
small_armor_width: 0.140   # 小装甲灯条矩形宽（m）
big_armor_width:   0.230   # 大装甲灯条矩形宽（m）
lightbar_length:   0.055   # 灯条长（m，矩形高方向）

#####----- 闭环自瞄（closed_loop_solver） -----#####
# Eye-in-Hand：用云台 IMU 回传的 yaw/pitch 构造旋转矩阵做闭环，不做手眼标定。
closed_loop_alpha: 0.3            # 一阶低通滤波系数 (0,1]，越小越平滑
yaw_limit: 1.57                    # yaw 输出限幅（rad，±90°）
pitch_limit: 0.35                  # pitch 输出限幅（rad，±20°）
closed_loop_imu_timeout_ms: 100   # IMU 超时判定失效（ms），超时角度置 0 停止跟随
closed_loop_debug: true           # 打印 tvec/云台姿态/世界坐标/滤波前后角度

#####----- 6 维扩展卡尔曼滤波（EKF，估计 [x,vx,y,vy,z,vz]） -----#####
# 状态/量测均在闭环世界系（X 前 / Y 右 / Z 上）。匀速直线模型 + 位置量测。
# 越小越平滑、响应越慢；越大越信任量测、速度估计越抖。
ekf_sigma_acc: 2.0                # 过程噪声：加速度扰动标准差 (m/s^2)
ekf_sigma_x: 0.02                 # 量测噪声标准差 x (m)
ekf_sigma_y: 0.02                 # 量测噪声标准差 y (m)
ekf_sigma_z: 0.02                 # 量测噪声标准差 z (m)
ekf_max_dt: 0.5                   # 预测步长上限（s），防止帧间隔异常导致 Q 发散

#####----- 节点默认参数（可被 launch 覆盖） -----#####
publish_rate: 30.0         # 下发频率（Hz），0 表示按相机帧率

#####----- 串口（serial_node） -----#####
serial_port: "/dev/ttyACM0"   # 串口设备节点
serial_baud: 460800           # 波特率（8N1）
# 说明：发送帧 yaw/pitch 为弧度，符号不取负（直接发期望角）。
# 若电控侧方向相反，改 src/serial_node.cpp 里 makeSendPacket 的正负号即可。
